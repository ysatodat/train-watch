<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>研究学園駅 Train Watch</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f7fbff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:720px;margin:auto;padding:18px 14px 44px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:#86a3bd}.title{font-size:27px;font-weight:950;margin-top:3px}.clock{text-align:right;font-variant-numeric:tabular-nums}.clock b{font-size:21px}.clock small{display:block;color:#91a6b8;margin-top:2px}.hero{margin-top:16px;background:linear-gradient(145deg,#122238,#0d1929);border:1px solid #28405a;border-radius:28px;padding:24px 16px 17px;text-align:center;overflow:hidden}.label{font-size:13px;font-weight:850;color:#9db2c5}.count{font-size:clamp(64px,18vw,102px);line-height:1;font-weight:950;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:12px 0}.message{font-size:19px;font-weight:900;min-height:28px}.meta{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:11px}.pill{font-size:12px;font-weight:850;padding:7px 10px;border-radius:999px;background:#1c2d40}.down{background:#153c30;color:#9ff0c9}.up{background:#19345e;color:#b9d6ff}.rapid{background:#5a3612;color:#ffd695}.rail{height:64px;position:relative;margin-top:14px;border-bottom:5px solid #6e7f8e}.rail:after{content:"";position:absolute;left:0;right:0;bottom:-12px;border-bottom:3px dashed #33495d}.train{position:absolute;left:5%;bottom:5px;font-size:42px}.urgent .train{animation:go 1.8s ease-in-out infinite alternate}@keyframes go{to{transform:translateX(min(480px,62vw))}}@media(prefers-reduced-motion:reduce){.urgent .train{animation:none}}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.controls button{border:1px solid #2e4358;background:#122238;color:#d8e6f2;border-radius:14px;min-height:46px;font-size:14px;font-weight:850}.controls button.active{background:#1778f2;border-color:#1778f2;color:white}.section{display:flex;justify-content:space-between;align-items:end;margin:19px 2px 9px}.section b{font-size:17px}.section span{font-size:11px;color:#7890a4}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:10px;align-items:center;background:#0e1b2a;border:1px solid #23384d;border-radius:16px;padding:12px}.time{font-size:20px;font-weight:950;font-variant-numeric:tabular-nums}.rowMain{min-width:0}.rowMain b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowMain small{color:#8299ac}.left{font-size:13px;font-weight:900;white-space:nowrap}.notice{margin-top:17px;padding:13px 14px;background:#102235;border:1px solid #28405a;border-radius:15px;color:#aec0cf;font-size:12px;line-height:1.6}.notice a{color:#8dc1ff}.beta{display:inline-block;margin-bottom:7px;background:#49370d;color:#ffd56a;border-radius:999px;padding:4px 8px;font-weight:900;font-size:11px}@media(max-width:370px){.title{font-size:23px}.count{font-size:61px}.row{grid-template-columns:59px minmax(0,1fr) auto}.time{font-size:18px}}
</style>
</head>
<body><main>
<div class="top"><div><div class="kicker">TX19 · TSUKUBA EXPRESS</div><div class="title">研究学園駅 🚆</div></div><div class="clock"><b id="clock">--:--:--</b><small id="date">--</small></div></div>
<section class="hero" id="hero" aria-live="polite"><div class="label">つぎに見られる電車まで</div><div class="count" id="count">--:--</div><div class="message" id="message">時刻を確認中…</div><div class="meta" id="meta"></div><div class="rail"><div class="train">🚆</div></div></section>
<div class="controls"><button id="all" class="active" type="button">通過も含める</button><button id="stop" type="button">停車列車だけ</button></div>
<div class="section"><b>このあと来る電車</b><span>1秒ごとに自動更新</span></div><div class="list" id="list"></div>
<div class="notice"><span class="beta">BETA</span><br>停車列車は公開時刻表の発車時刻を基準にしています。実際の入線は数十秒前になることがあります。快速は研究学園駅を通過するため、つくば駅の快速時刻から所要時間をもとにした<strong>推定通過時刻</strong>です（目安 ±1分）。遅延・運休は反映しません。現在は親子で電車を見やすい日中〜夜の土日祝ダイヤを中心に収録しています。<br><a href="https://www.mir.co.jp/route_map/kenkyu-gakuen/">TX公式・研究学園駅</a></div>
</main>
<script>
(()=>{
const stopDown=["10:08","10:24","10:35","10:51","11:05","11:21","11:35","11:51","12:05","12:21","12:35","12:51","13:05","13:21","13:35","13:51","14:05","14:21","14:35","14:51","15:05","15:21","15:35","15:51","16:05","16:21","16:35","16:51","17:05","17:21","17:35","17:51","18:05","18:21","18:35","18:51","19:05","19:21","19:35","19:51","20:05","20:21","20:35","20:51","21:05","21:21","21:35","21:51","22:06","22:20","22:34","22:51","23:06","23:21","23:36","23:51"];
const stopUp=[];for(let h=10;h<=21;h++){["07","23","37","53"].forEach(m=>stopUp.push(String(h).padStart(2,"0")+":"+m))}
const rapidDown=[];const rapidUp=[];for(let h=10;h<=21;h++){["13","43"].forEach(m=>rapidDown.push(String(h).padStart(2,"0")+":"+m));["14","44"].forEach(m=>rapidUp.push(String(h).padStart(2,"0")+":"+m))}
const make=(arr,dir,kind,approx=false)=>arr.map(time=>({time,dir,kind,approx}));
const stops=[...make(stopDown,"つくば方面","停車"),...make(stopUp,"秋葉原方面","停車")];
const rapids=[...make(rapidDown,"つくば方面","快速・通過",true),...make(rapidUp,"秋葉原方面","快速・通過",true)];
let includeRapid=true;
const $=id=>document.getElementById(id),hero=$("hero"),count=$("count"),msg=$("message"),meta=$("meta"),list=$("list"),clock=$("clock"),date=$("date");
function target(t,now){const [h,m]=t.split(":").map(Number),d=new Date(now);d.setHours(h,m,0,0);return d}
function events(now){return (includeRapid?[...stops,...rapids]:stops).map(e=>({...e,target:target(e.time,now)})).filter(e=>e.target-now>=-2500).sort((a,b)=>a.target-b.target)}
function remain(ms){const s=Math.max(0,Math.ceil(ms/1000));if(s<60)return `あと${s}秒`;return `あと${Math.floor(s/60)}分${String(s%60).padStart(2,"0")}秒`}
function tick(){const now=new Date();clock.textContent=now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});date.textContent=now.toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"});const es=events(now);if(!es.length){count.textContent="--:--";msg.textContent="登録時間帯は終了です";meta.innerHTML="";list.innerHTML="";return}const e=es[0],sec=Math.max(0,Math.ceil((e.target-now)/1000));count.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");msg.textContent=sec<=30?"もうすぐ！線路を見よう 👀":sec<=90?"そろそろ来るよ！":"でんしゃを待とう！";hero.classList.toggle("urgent",sec<=90);meta.innerHTML=`<span class="pill ${e.dir.startsWith("つくば")?"down":"up"}">${e.dir}</span><span class="pill">${e.time}ごろ</span><span class="pill ${e.approx?"rapid":""}">${e.approx?"快速通過・推定":"停車"}</span>`;list.innerHTML=es.slice(0,7).map(x=>`<div class="row"><div class="time">${x.time}</div><div class="rowMain"><b>${x.dir}</b><small>${x.approx?"快速・通過（推定）":"停車列車"}</small></div><div class="left">${remain(x.target-now)}</div></div>`).join("")}
$("all").addEventListener("click",()=>{includeRapid=true;$("all").classList.add("active");$("stop").classList.remove("active");tick()});$("stop").addEventListener("click",()=>{includeRapid=false;$("stop").classList.add("active");$("all").classList.remove("active");tick()});tick();setInterval(tick,250);
})();
</script></body></html>
