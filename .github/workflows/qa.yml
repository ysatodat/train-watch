name: Product QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source data JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/timetable.json','utf8')); console.log('TX timetable JSON valid')"
          node -e "JSON.parse(require('fs').readFileSync('data/tx-profile.json','utf8')); console.log('TX profile JSON valid')"
          node -e "JSON.parse(require('fs').readFileSync('data/keisei-main-stations.json','utf8')); console.log('Keisei station catalog valid')"
          node -e "JSON.parse(require('fs').readFileSync('data/keisei-main.json','utf8')); console.log('Keisei timetable JSON valid')"
          node -e "JSON.parse(require('fs').readFileSync('data/keisei-profile.json','utf8')); console.log('Keisei profile JSON valid')"
      - name: Validate Keisei official timetable parser
        run: node scripts/inspect-keisei.mjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Verify production output
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -d dist/assets
          test -f dist/data/timetable.json
          test -f dist/data/keisei-main.json
          ! grep -R "TX専用" dist/index.html dist/assets

  user-scenario-qa:
    needs: static-qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Start Vite app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/train-watch-vite.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/train-watch-vite.log
          exit 1
      - name: Run mobile WebKit user scenarios
        run: npm run test:scenario
