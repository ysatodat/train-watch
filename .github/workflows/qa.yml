name: Product QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check train-engine.js
          node --check app.js
          node --check dialog-controller.js
          node --check microinteractions.js
          node --check moments-interactions.js
      - name: Run product QA
        run: |
          node tests/static-qa.mjs
          node tests/moments-qa.mjs