name: Product QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check train-engine.js
          node --check app.js
          node --check dialog-controller.js
          node --check onboarding.js
          node --check tx-special.js
          node --check microinteractions.js
          node --check moments-interactions.js
          node --check scripts/inspect-keisei.mjs
      - name: Validate data JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/timetable.json','utf8')); console.log('Timetable JSON valid')"
          node -e "JSON.parse(require('fs').readFileSync('data/tx-profile.json','utf8')); console.log('TX profile JSON valid')"
          node -e "JSON.parse(require('fs').readFileSync('data/keisei-main-stations.json','utf8')); console.log('Keisei station catalog valid')"
      - name: Generate Keisei official timetable snapshot
        run: node scripts/inspect-keisei.mjs
      - name: Persist first Keisei snapshot to feature branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ ! -f data/keisei-main.json ]; then
            cp generated/keisei-main.json /tmp/keisei-main.json
            git fetch origin "${{ github.head_ref }}"
            git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
            cp /tmp/keisei-main.json data/keisei-main.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/keisei-main.json
            git commit -m 'data: add official Keisei Main Line timetable snapshot'
            git push origin "${{ github.head_ref }}"
          fi
      - name: Run product QA
        run: |
          node tests/static-qa.mjs
          node tests/tx-static-qa.mjs
          node tests/moments-qa.mjs
          node tests/observation-qa.mjs

  user-scenario-qa:
    needs: static-qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scenario test runner
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Start local app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/train-watch-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/train-watch-server.log
          exit 1
      - name: Run user scenarios on mobile WebKit
        run: npm run test:scenario
